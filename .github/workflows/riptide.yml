name: Riptide daily run

on:
  schedule:
    - cron: "40 16 * * 1-5"
    - cron: "35 19 * * 1-5"
    - cron: "35 20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: riptide
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Run Riptide
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RIPTIDE_LOG: riptide_auto_log.csv
        run: python riptide_auto.py
      - name: Save the trade log
        if: always()
        run: |
          git config user.name "riptide-bot"
          git config user.email "riptide-bot@users.noreply.github.com"
          git add -f riptide_auto_log.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Riptide log $(date -u +%F)" && git push)
